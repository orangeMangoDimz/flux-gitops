apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: prod
  name: job-agent-async-api-usage
spec:
  schedule: "15 0 * * *"
  timeZone: "Asia/Jakarta"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: async-api-usage
              image: ghcr.io/pt-sinan-akbar/job-agent-be/prod:0-0000000 # {"$imagepolicy": "flux-system:job-agent-be"}
              imagePullPolicy: IfNotPresent
              command: ["python", "manage.py", "sync_api_usage"]
              env:
                - name: SKIP_MIGRATE
                  value: "1"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              envFrom:
                - configMapRef:
                    name: job-agent-be-config
                - secretRef:
                    name: job-agent-be-secret
          restartPolicy: Never
