apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: job-scrapper-revamp-mcp
spec:
  podSelector:
    matchLabels:
      app: job-scrapper-revamp-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dev
      ports:
        - protocol: TCP
          port: 8080
