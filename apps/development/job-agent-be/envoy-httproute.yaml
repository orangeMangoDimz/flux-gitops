apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: job-agent-be-dev
  namespace: envoy
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy
      sectionName: dev-job-agent
  hostnames:
    - dev.job-agent.dimasdanizaini.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: job-agent-be-service
          namespace: dev
          port: 80
      timeouts:
        request: 1h
    - matches:
        - path:
            type: PathPrefix
            value: /admin
        - path:
            type: PathPrefix
            value: /static
        - path:
            type: Exact
            value: /schema
      backendRefs:
        - name: job-agent-be-service
          namespace: dev
          port: 80
