apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: job-agent-fe-dev
  namespace: envoy
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy
      sectionName: dev-job-agent
  hostnames:
    - dev.job-agent.dimasdanizaini.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: job-agent-fe-service
          namespace: dev
          port: 80
