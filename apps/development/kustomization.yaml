# The dev environment, talking to the disposable postgres in data/development:
# bandung-coffeeshop behind basic auth on dev.bdgcafe.com, one replica each, and
# job-agent on dev.job-agent.dimasdanizaini.xyz, one replica each.
#
# One kustomize build, for the same reason apps/production is — the ConfigMaps are
# hash-suffixed and kustomize only rewrites references to them within a single build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap
  - bandung-coffeeshop-be
  - bandung-coffeeshop-fe
  - job-agent-be
  - job-agent-fe
  - job-scrapper-revamp
